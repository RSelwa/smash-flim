name: 🚀 Deploy to VPS

on:
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

env:
  DEPLOY_PATH: /var/www/smash-flim
  NODE_BIN: /home/debian/.nvm/versions/node/v24.14.1/bin
  HEALTH_URL: http://127.0.0.1:3010/api/players

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: 🚀 Build and deploy
    environment: prod
    env:
      VPS_HOST: ${{ vars.VPS_HOST }}
      VPS_USER: ${{ vars.VPS_USER }}
    steps:
      - name: ✨ Checkout
        uses: actions/checkout@v7

      - name: 📦 Set up pnpm
        uses: pnpm/action-setup@v6

      - name: 🟢 Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: 📥 Install dependencies
        run: pnpm install --frozen-lockfile

      - name: 🔍 Lint
        run: pnpm lint

      - name: 🧪 Test
        run: pnpm test

      - name: 🏗️ Build
        run: pnpm build

      - name: 📦 Assemble the release
        run: |
          set -euo pipefail
          mkdir release
          cp -r dist server package.json pnpm-lock.yaml ecosystem.config.cjs release/
          rm release/server/*.test.ts
          pnpm --dir release install --prod --frozen-lockfile --config.node-linker=hoisted

      - name: 🔑 Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts

      - name: 🚚 Upload the release
        run: >-
          rsync --archive --compress --delete --exclude=/data/
          --rsh "ssh -i ~/.ssh/deploy_key"
          release/ "$VPS_USER@$VPS_HOST:$DEPLOY_PATH/"

      - name: ♻️ Reload the API
        run: |
          ssh -i ~/.ssh/deploy_key "$VPS_USER@$VPS_HOST" bash -s <<EOF
          set -euo pipefail
          export PATH="$NODE_BIN:\$PATH"
          cd "$DEPLOY_PATH"
          pm2 startOrReload ecosystem.config.cjs --update-env
          pm2 save
          curl --silent --fail --retry 15 --retry-delay 2 --retry-all-errors "$HEALTH_URL" > /dev/null
          echo "smash-flim API is up"
          EOF
