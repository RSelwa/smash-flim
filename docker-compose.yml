services:
  smash-flim:
    image: node:24-alpine
    restart: unless-stopped
    working_dir: /app
    command: ["node", "server/index.ts"]
    environment:
      NODE_ENV: production
      PORT: 3000
    ports:
      - "127.0.0.1:3010:3000"
    volumes:
      - ./:/app:ro
      - ./data:/app/data
